 const q=Q[order[r]];

 if(i===q[3]){const pts=100+left*3;score+=pts;$("st").textContent="Correct! +"+pts}else $("st").textContent=i<0?"Time’s up!":"Not quite.";
 sync();board();
 setTimeout(()=>{pending=r+1;sync({done:pending});advance()},1800);
}
function advance(){
 if(!pending)return;
 const f=friend();
 if(rm&&f&&(f.presence.done||0)<pending){$("st").textContent="Waiting for your friend…";return}
 const p=pending;pending=0;
 if(p>=N)return end();
 r=p;show();
}
function end(){
 const f=friend(),rows=[{n:String(name).slice(0,16),s:score,me:1}];
 if(f)rows.push({n:fname(f),s:f.presence.score||0});
 rows.sort((a,b)=>b.s-a.s);
 const tie=rows.length>1&&rows[0].s===rows[1].s;
 const top=tie?"It’s a tie!":rows.length===1?"Nice game!":rows[0].me?"You win! 🎉":rows[0].n+" wins!";
 $("qa").innerHTML='<div class="qt" style="text-align:center">'+esc(top)+'</div><h3 style="margin-top:6px">Leaderboard</h3>'+rows.map((x,i)=>'<div class="lr"><span class="rk">'+(i+1)+'</span><span class="av sm">'+esc((x.n[0]||"?").toUpperCase())+'</span><span class="ln"><b>'+esc(x.n)+(x.me?" (you)":"")+'</b><small>'+x.s+' points</small></span>'+(i===0&&!tie?"<span>👑</span>":"")+'</div>').join("")+'<div class="nx" style="cursor:pointer" onclick="location.reload()">Play again</div>';
 $("pg").style.width="100%";board();
}
function begin(){
 if(started)return;started=true;
 let m=sel.slice();const f=friend();
 if(rm&&f&&f.presence.cats){const ft=f.presence.t||0,fc=String(f.presence.cats);if(ft<myT||(ft===myT&&fc<m.join("|")))m=fc.split("|")}
 m=m.filter(x=>CATS.includes(x));if(!m.length)m=CATS.slice();
 order=pick(code||String(Date.now()),m);r=0;score=0;sync({done:0});show();
}
function joinRoom(code){
 return new Promise((res,rej)=>{
  const ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host);
  let peers=[],hs=[],ok=false;
  const rm={peers:()=>peers,presence:p=>{if(ws.readyState===1)ws.send(JSON.stringify({t:"p",p:p}));return Promise.resolve()},onPeers:h=>hs.push(h)};
  ws.onopen=()=>ws.send(JSON.stringify({t:"join",room:code}));
  ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}
   if(m.t==="full"){rej(new Error("full"));return}
   if(m.t==="s"){peers=m.peers.map(x=>({isMe:x.id===m.me,presence:x.p}));if(!ok){ok=true;res(rm)}hs.forEach(h=>h())}};
  ws.onerror=()=>{if(!ok)rej(new Error("conn"))};
  ws.onclose=()=>{if(!ok)rej(new Error("conn"))};
 });
}
async function start(online){
 name=$("nm").value.trim()||"Player";
 code=($("cd").value.trim().toLowerCase().replace(/[^a-z0-9]/g,""))||"";
 $("home").classList.add("hide");$("game").classList.remove("hide");
 if(!online){board();begin();return}
 if(!code)code="r"+Math.random().toString(36).slice(2,6);
 $("qa").innerHTML='<div class="wait"><div class="qt">Joining room…</div></div>';
 try{
  rm=await joinRoom(code);
  rm.onPeers(()=>{board();const f=friend();if(!started&&f&&f.presence.t)begin();else advance()});
  sync({done:0});board();
  $("qa").innerHTML='<div class="wait"><div class="qt">Waiting for your friend…</div><p>Ask them to open this page and enter the room code</p><div class="code">'+esc(code.toUpperCase())+'</div></div>';
  if(friend()&&friend().presence.t)begin();
 }catch(e){
  rm=null;board();
  $("qa").innerHTML='<div class="wait"><div class="qt">Couldn’t join the room.</div><p>The room may already have two players, or the connection failed. Try a different code.</p><div class="nx" id="pr" style="cursor:pointer">Practice alone</div></div>';
  $("pr").onclick=()=>begin();
 }
}
$("nm").oninput=e=>{const v=e.target.value.trim();$("av").textContent=(v[0]||"Q").toUpperCase();$("hi").textContent=v?"Hi, "+v:"Quiz Challenge"};
function drawCats(){
 $("cats").innerHTML=CATS.map(c=>'<button class="cc'+(sel.includes(c)?' on':'')+'" data-c="'+c+'">'+c+'</button>').join("");
 $("cs").textContent=(sel.length===CATS.length?"All "+CATS.length+" categories":sel.join(", "))+" · "+Q.filter(q=>sel.includes(q[0])).length+" questions";
}
$("cats").onclick=e=>{const c=e.target.dataset.c;if(!c)return;if(sel.includes(c)){if(sel.length>1)sel=sel.filter(x=>x!==c)}else sel.push(c);drawCats()};
$("catb").onclick=()=>$("cw").classList.toggle("hide");
drawCats();
$("go").onclick=()=>start(true);$("solo").onclick=()=>start(false);
</script></main></body></html>
