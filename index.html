let rm=null,order=[],r=0,score=0,left=T,tm=null,code="",name="",started=false,pending=0,locked=false,stg=[],hist=[],myBase=0,fBase=0,phase="q",wantRdy=0;
function rng(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}let a=h>>>0;return()=>{a+=0x6D2B79F5;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function pick(seed,mask,n){const f=rng(seed+mask.join("|")),a=Q.map((_,i)=>i).filter(i=>mask.includes(Q[i][0]));for(let i=a.length-1;i>0;i--){const j=Math.floor(f()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,n)}
Q.forEach((q,i)=>{if(q[2].every(o=>/^[0-9]/.test(o)))return;const f=rng("opt"+i),ix=q[2].map((_,k)=>k);for(let k=ix.length-1;k>0;k--){const j=Math.floor(f()*(k+1));[ix[k],ix[j]]=[ix[j],ix[k]]}const a=q[2][q[3]];q[2]=ix.map(k=>q[2][k]);q[3]=q[2].indexOf(a)});
function build(seed,cats){let o=[];cats.forEach(c=>o.push(...pick(seed,[c],PER)));return o}
const friend=()=>rm?rm.peers().find(p=>!p.isMe):null;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fname=f=>String(f.presence.name||"Friend").slice(0,16);
function board(){
 $("me").textContent="You "+score;
 const f=friend();
 $("fr").style.display=rm?"":"none";
 $("fr").textContent=f?fname(f)+" "+(f.presence.score||0):"Friend –";
 $("pg").style.width=(started?(r%PER)/PER*100:0)+"%";
}
function sync(extra){if(rm)rm.presence(Object.assign({name:name,score:score,t:myT},extra||{})).catch(()=>{})}
function fnote(){
 const el=$("fa");if(!el)return;const f=friend();
 if(!rm||!f||locked||phase!=="q"){el.style.display="none";return}
 const aq=f.presence.aq||0,ar=f.presence.ar||0;
 if(aq===r+1&&ar){
  el.className="fa "+(ar===1?"ok":ar===2?"no":"to");
  el.textContent=fname(f)+(ar===1?" answered correctly ✅":ar===2?" answered and got it wrong ❌":" ran out of time ⏰")+" — waiting for you";
  el.style.display="block";
 }else el.style.display="none";
}
function show(){
 const q=Q[order[r]];locked=false;left=T;
 $("qa").innerHTML='<div class="tm" id="tm" style="--p:100"><span id="tn">'+T+'</span></div><div class="fa" id="fa" style="display:none"></div><div class="qn">Stage '+(Math.floor(r/PER)+1)+' of '+STG+' · '+q[0]+' · Question '+(r%PER+1)+' of '+PER+'</div><div class="qt">'+q[1]+'</div><div id="ops"></div><div class="nx" id="st">Pick an answer</div>';
 q[2].forEach((o,i)=>{const b=document.createElement("button");b.className="o";b.textContent="ABCD"[i]+". "+o;b.onclick=()=>choose(i);$("ops").appendChild(b)});
 clearInterval(tm);tm=setInterval(()=>{left--;$("tn").textContent=Math.max(left,0);$("tm").style.setProperty("--p",left/T*100);if(left<=0)choose(-1)},1000);
 board();fnote();
}
function choose(i){
 if(locked)return;locked=true;clearInterval(tm);
 const q=Q[order[r]];
 document.querySelectorAll(".o").forEach((b,k)=>{b.disabled=true;if(k===q[3])b.classList.add("ok");else if(k===i)b.classList.add("no")});
 if(i===q[3]){const pts=100+left*3;score+=pts;$("st").textContent="Correct! +"+pts}else $("st").textContent=i<0?"Time’s up!":"Not quite.";
 sync({aq:r+1,ar:i===q[3]?1:(i<0?3:2)});board();fnote();
 setTimeout(()=>{pending=r+1;sync({done:pending});advance()},1800);
}
function advance(){
 if(!pending)return;
 const f=friend();
 if(rm&&f&&(f.presence.done||0)<pending){$("st").textContent="Waiting for your friend…";return}
 const p=pending;pending=0;
 if(p%PER===0)stageDone(p);else{r=p;show()}
}
function stageDone(p){
 clearInterval(tm);
 const si=p/PER-1,f=friend(),fs=f?(f.presence.score||0):0;
 const mine=score-myBase,theirs=f?fs-fBase:0,fn=f?fname(f):"";
 myBase=score;fBase=fs;
 hist.push({c:stg[si],me:mine,fr:theirs,fn:fn,has:!!f});
 if(p>=N)return end();
 phase="res";
 const tie=mine===theirs,title=!f?"Stage "+(si+1)+" complete":tie?"Stage "+(si+1)+" is a tie!":mine>theirs?"You win Stage "+(si+1)+"! 🎉":esc(fn)+" wins Stage "+(si+1)+"!";
 $("qa").innerHTML='<div class="qt" style="text-align:center">'+title+'</div><div class="qn" style="text-align:center">'+esc(stg[si])+'</div>'
  +'<div class="lr"><span class="ln"><b>You</b><small>Stage: '+mine+' pts · Total: '+score+'</small></span></div>'
  +(f?'<div class="lr"><span class="ln"><b>'+esc(fn)+'</b><small>Stage: '+theirs+' pts · Total: '+fs+'</small></span></div>':'')
  +'<div class="nx" id="nxst" style="cursor:pointer">Start Stage '+(si+2)+': '+esc(stg[si+1])+' →</div>';
 $("nxst").onclick=()=>{if(wantRdy)return;wantRdy=si+1;sync({rdy:wantRdy});checkReady()};
 board();
}
function checkReady(){
 if(phase!=="res"||!wantRdy)return;
 const f=friend();
 if(rm&&f&&(f.presence.rdy||0)<wantRdy){const b=$("nxst");if(b)b.textContent="Waiting for your friend…";return}
 phase="q";r=wantRdy*PER;wantRdy=0;show();
}
function end(){
 const f=friend(),rows=[{n:String(name).slice(0,16),s:score,me:1}];
 if(f)rows.push({n:fname(f),s:f.presence.score||0});
 rows.sort((a,b)=>b.s-a.s);
 const tie=rows.length>1&&rows[0].s===rows[1].s;
 const top=tie?"It’s a tie!":rows.length===1?"Nice game!":rows[0].me?"You win! 🎉":rows[0].n+" wins!";
 $("qa").innerHTML='<div class="qt" style="text-align:center">'+esc(top)+'</div><h3 style="margin-top:6px">Leaderboard</h3>'+rows.map((x,i)=>'<div class="lr"><span class="rk">'+(i+1)+'</span><span class="av sm">'+esc((x.n[0]||"?").toUpperCase())+'</span><span class="ln"><b>'+esc(x.n)+(x.me?" (you)":"")+'</b><small>'+x.s+' points</small></span>'+(i===0&&!tie?"<span>👑</span>":"")+'</div>').join("")+'<h3 style="margin-top:12px">Stages</h3>'+hist.map((x,i)=>{const w=!x.has?"":x.me===x.fr?"Tie":x.me>x.fr?"You won":esc(x.fn)+" won";return '<div class="lr"><span class="ln"><b>Stage '+(i+1)+' · '+esc(x.c)+'</b><small>You '+x.me+(x.has?' · '+esc(x.fn)+' '+x.fr+' · '+w:'')+'</small></span></div>'}).join("")+'<div class="nx" style="cursor:pointer" onclick="location.reload()">Play again</div>';
 $("pg").style.width="100%";board();
}
function begin(){
 if(started)return;started=true;
 stg=CATS.slice();hist=[];myBase=0;fBase=0;phase="q";wantRdy=0;
 order=build(code||String(Date.now()),stg);r=0;score=0;sync({done:0,rdy:0,aq:0,ar:0});show();
}
function joinRoom(code,mode){
 return new Promise((res,rej)=>{
  const ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host);
  let peers=[],hs=[],ok=false;
  const rm={peers:()=>peers,presence:p=>{if(ws.readyState===1)ws.send(JSON.stringify({t:"p",p:p}));return Promise.resolve()},onPeers:h=>hs.push(h)};
  ws.onopen=()=>ws.send(JSON.stringify({t:"join",room:code,mode:mode}));
  ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}
   if(m.t==="full"||m.t==="exists"||m.t==="none"){rej(new Error(m.t));return}
   if(m.t==="s"){peers=m.peers.map(x=>({isMe:x.id===m.me,presence:x.p}));if(!ok){ok=true;res(rm)}hs.forEach(h=>h())}};
  ws.onerror=()=>{if(!ok)rej(new Error("conn"))};
  ws.onclose=()=>{if(!ok)rej(new Error("conn"))};
 });
}
function mkCode(){const a="abcdefghjkmnpqrstuvwxyz23456789";let c="";for(let i=0;i<4;i++)c+=a[Math.floor(Math.random()*a.length)];return c}
async function start(mode){
 name=$("nm").value.trim()||"Player";myT=Date.now();
 const typed=($("cd").value.trim().toLowerCase().replace(/[^a-z0-9]/g,""))||"";
 $("err").textContent="";
 if(mode==="join"&&!typed){$("err").textContent="Type your friend's room code first.";return}
 $("home").classList.add("hide");$("game").classList.remove("hide");
 if(mode==="solo"){code="";board();begin();return}
 $("qa").innerHTML='<div class="wait"><div class="qt">'+(mode==="create"?"Creating room…":"Joining room…")+'</div></div>';
 try{
  if(mode==="create"){
   for(let i=0;;i++){
    code=mkCode();
    try{rm=await joinRoom(code,"create");break}catch(e){if(e.message!=="exists"||i>=5)throw e}
   }
  }else{code=typed;rm=await joinRoom(code,"join")}
  rm.onPeers(()=>{board();fnote();const f=friend();if(!started&&f&&f.presence.t)begin();else{advance();checkReady()}});
  sync({done:0});board();
  if(mode==="create"){
   $("qa").innerHTML='<div class="wait"><div class="qt">Room created!</div><p>Tell your friend to tap <b>Join room</b> and enter this code</p><div class="code">'+esc(code.toUpperCase())+'</div><p>Waiting for your friend…</p></div>';
  }else{
   $("qa").innerHTML='<div class="wait"><div class="qt">Joined room '+esc(code.toUpperCase())+'</div><p>Starting…</p></div>';
  }
  if(friend()&&friend().presence.t)begin();
 }catch(e){
  rm=null;board();
  const msg=e.message==="none"?"Room not found. Check the code, or ask your friend to create the room first.":e.message==="full"?"That room already has two players.":e.message==="exists"?"Could not create a room. Please try again.":"Connection failed. Check your internet and try again.";
  $("qa").innerHTML='<div class="wait"><div class="qt">Couldn’t '+(mode==="create"?"create":"join")+' the room.</div><p>'+msg+'</p><div class="nx" id="bk" style="cursor:pointer">Back</div><div class="nx" id="pr" style="cursor:pointer;margin-top:8px">Practice alone</div></div>';
  $("pr").onclick=()=>begin();
  $("bk").onclick=()=>location.reload();
 }
}
$("nm").oninput=e=>{const v=e.target.value.trim();$("av").textContent=(v[0]||"Q").toUpperCase();$("hi").textContent=v?"Hi, "+v:"Quiz Challenge"};
function drawCats(){
 $("cats").innerHTML=CATS.map((c,i)=>'<button class="cc on" style="pointer-events:none">'+(i+1)+'. '+c+'</button>').join("");
 $("cs").textContent=STG+" stages · 15 questions each";
}
$("catb").onclick=()=>$("cw").classList.toggle("hide");
drawCats();
$("create").onclick=()=>start("create");$("join").onclick=()=>start("join");$("solo").onclick=()=>start("solo");
</script></main></body></html>
